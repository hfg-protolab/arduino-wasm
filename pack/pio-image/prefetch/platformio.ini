; Template project of the pio-image: one env per board, built once at image build time
; (`pio run`) so every platform, toolchain and framework a pack build needs is in the image.
; Platform pins must match the boards in pack/config.json.

[platformio]
src_dir = src

[env]
framework = arduino

[env:uno]
platform = atmelavr@5.3.0
board = uno

[env:nano]
platform = atmelavr@5.3.0
board = nanoatmega328new

[env:nano-old]
platform = atmelavr@5.3.0
board = nanoatmega328

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev

[env:esp32-s3]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1

[env:esp32-c3]
platform = espressif32@7.1.3
board = esp32-c3-devkitm-1
