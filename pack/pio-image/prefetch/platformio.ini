; Template project of the pio-image: one env per board, built once at image build time
; (`pio run`) so every platform, toolchain and framework a pack build needs is in the image.
; Platform pins must match the boards in pack/config.json.

[platformio]
src_dir = src

[env]
framework = arduino

[env:uno]
platform = atmelavr@5.3.0
board = uno

[env:nano]
platform = atmelavr@5.3.0
board = nanoatmega328new

[env:mega]
platform = atmelavr@5.3.0
board = megaatmega2560

[env:leonardo]
platform = atmelavr@5.3.0
board = leonardo

[env:nano-old]
platform = atmelavr@5.3.0
board = nanoatmega328

; pioarduino 55.03.39 = Arduino-ESP32 3.3.9 / ESP-IDF 5.5.4 (pinned release URL)
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev

[env:esp32-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1

[env:esp32-c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c3-devkitm-1

[env:esp32-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-c6-devkitc-1

[env:nano-esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = arduino_nano_esp32

[env:nodemcu]
platform = espressif8266@4.2.1
board = nodemcuv2

[env:d1-mini]
platform = espressif8266@4.2.1
board = d1_mini
